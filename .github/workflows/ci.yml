name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------
      # Docker Hub Login
      # -----------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # -----------------------------------
      # Build Images
      # -----------------------------------

      - name: Build Backend Image
        run: |
          docker build -t jsdaya2211/backend:v2 ./backend

      - name: Build Frontend Image
        run: |
          docker build -t jsdaya2211/frontend:v1 ./frontend

      - name: Build Nginx Image
        run: |
          docker build -t jsdaya2211/nginx:v1 ./nginx


      # -----------------------------------
      # Push Images
      # -----------------------------------

      - name: Push Backend Image
        run: |
          docker push jsdaya2211/backend:v2

      - name: Push Frontend Image
        run: |
          docker push jsdaya2211/frontend:v1

      - name: Push Nginx Image
        run: |
          docker push jsdaya2211/nginx:v1

            
      # -----------------------------------
      # Deploy To EC2
      # -----------------------------------      

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd devop-task-platform

            git pull origin main

            sudo docker compose down

            sudo docker compose pull

            sudo docker compose up -d

            sudo docker ps            